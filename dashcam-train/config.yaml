# =============================================================================
# AI DASHCAM iOS - cấu hình duy nhất cho phần Python train mô hình (dashcam_ml)
# -----------------------------------------------------------------------------
# - Mọi đường dẫn tương đối được tính từ THƯ MỤC CHỨA FILE NÀY.
# - Project này: dữ liệu -> train -> đánh giá -> xuất Core ML.
# - Chạy video + ngưỡng cảnh báo (tracker/fcw/ldw) + DashcamConfig.json nằm ở project
#   dashcam-video đặt cạnh (../dashcam-video).
# =============================================================================

project:
    name: AIDashCam
    output_dir: outputs            # mọi kết quả chạy đều nằm dưới đây (không đưa vào Git)
    seed: 42
    device: auto                   # auto | cpu | 0 (GPU NVIDIA đầu tiên) | mps (Mac Apple Silicon)
    log_level: INFO                # DEBUG | INFO | WARNING | ERROR

# -----------------------------------------------------------------------------
# Tên lớp chuẩn của dự án (giống bdd100k.class_names) và các tên khác của cùng lớp.
# COCO và BDD100K bản Dataset Ninja dùng "person", "motor", "bike"; dự án dùng "pedestrian",
# "motorcycle", "bicycle". Alias giúp so khớp trọng số COCO với tập nhãn BDD100K / VN khi đánh giá.
# Kích thước thật của từng lớp (để ước lượng khoảng cách) nằm ở config của dashcam-video.
# -----------------------------------------------------------------------------
classes:
    - name: car
    - name: truck
    - name: bus
    - name: motorcycle
      aliases: [motor, motorbike]
    - name: bicycle
      aliases: [bike]
    - name: pedestrian
      aliases: [person]
    - name: rider

# =============================================================================
# DỮ LIỆU
# =============================================================================

# CV02 - chuyển nhãn BDD100K sang định dạng YOLO
bdd100k:
    # Bản Dataset Ninja: bên trong có {train,val}/img/*.jpg và {train,val}/ann/*.jpg.json
    dataset_root: data/bdd100k     # bản mẫu hay bản đầy đủ đều đặt ở đây; đổi dữ liệu = thay thư mục, không sửa config
    output_dir: data/yolo_bdd100k
    class_names: [pedestrian, rider, car, truck, bus, train, motorcycle, bicycle, traffic light, traffic sign]
    category_aliases:              # tên lớp trong Dataset Ninja -> tên trong class_names; lớp khác (drivable area, lane) bị bỏ
        person: pedestrian
        bike: bicycle
        motor: motorcycle
    copy_mode: hardlink            # hardlink (không tốn ổ, cần cùng ổ đĩa; khác ổ thì tự copy) | copy
    max_images_per_split: null     # ví dụ 500: chỉ đọc 500 file nhãn đầu (theo tên) mỗi split, để thử nhanh (CV01); null = dùng hết
    condition_splits:              # tạo thêm tập val theo điều kiện khó (CV15)
        night: {timeofday: night}
        rainy: {weather: rainy}
        daytime: {timeofday: daytime}

# CV08 - trích khung hình từ video tự quay ở Việt Nam
frame_extraction:
    videos_dir: data/vn_videos
    output_dir: data/vn_frames
    video_extensions: [.mp4, .mov, .avi, .mkv]
    every_n_seconds: 1.0
    blur_threshold: 80.0           # phương sai Laplacian thấp hơn => ảnh mờ, bỏ
    duplicate_threshold: 4.0       # chênh lệch trung bình (0-255) với ảnh trước thấp hơn => trùng, bỏ
    jpeg_quality: 95
    name_separator: "__"           # tên ảnh: <tên_video>__f000123.jpg (dùng khi chia tập)

# CV09 - chia train/val/test THEO TỪNG VIDEO để không rò khung hình giữa các tập
split:
    images_dir: data/vn_labeled/images
    labels_dir: data/vn_labeled/labels
    output_dir: data/vn_split
    class_names: [pedestrian, rider, car, truck, bus, train, motorcycle, bicycle, traffic light, traffic sign]
    name_separator: "__"
    copy_mode: hardlink
    ratios:
        train: 0.70
        val: 0.15
        test: 0.15

# =============================================================================
# HUẤN LUYỆN & ĐÁNH GIÁ (phương án A)
# =============================================================================

# CV12 - fine-tune YOLO. Tên chính thức (yolo11n.pt) sẽ được tự tải về.
train:
    model: outputs/pretrained_coco/yolo11n.pt   # mô hình gốc học trên COCO; giữ tên yolo11n.pt để Ultralytics tự tải lại khi thiếu
    data_yaml: data/yolo_bdd100k/dataset.yaml
    epochs: 100
    imgsz: 640
    batch: 16
    workers: 4
    patience: 20
    optimizer: auto
    lr0: 0.01
    cos_lr: false
    amp: true
    cache: false
    resume: false
    run_name: yolo11n_bdd100k

# CV11 / CV10 - so sánh nhiều trọng số và nhiều kích thước ảnh trên cùng tập test
evaluate:
    weights:
        - outputs/pretrained_coco/yolo11n.pt               # trước khi train
        - outputs/train/yolo11n_bdd100k/weights/best.pt    # sau khi train trên BDD100K
    # Tạm chấm trên tập val BDD100K; khi có dữ liệu VN (CV09) đổi thành data/vn_split/dataset.yaml + split: test
    data_yaml: data/yolo_bdd100k/dataset.yaml
    split: val                     # key trong dataset.yaml: val (109 ảnh) | val_night | val_daytime | val_rainy | test
    imgsz_list: [320, 416, 640]    # chạy thử nhanh: [320]
    conf: 0.001
    iou: 0.6
    batch: 8                       # máy CPU; máy có GPU có thể tăng lên 16
    focus_classes: [motorcycle]    # in riêng precision/recall của các lớp này
    copy_mode: hardlink

# =============================================================================
# PHƯƠNG ÁN B: TwinLiteNet (mô hình làn đường, để xuất Core ML)
# Cảnh báo lệch làn (LDW) chạy ở dashcam-video, dùng chung repo clone ở đây.
# =============================================================================

twinlitenet:
    repo_dir: third_party/TwinLiteNet        # git clone repo của tác giả vào đây
    module: model.TwinLite                   # file model/TwinLite.py trong repo
    class_name: TwinLiteNet
    weights: third_party/TwinLiteNet/pretrained/best.pth
    state_dict_prefix: "module."             # trọng số lưu từ DataParallel
    input_width: 640
    input_height: 360
    mask_threshold: 0.5

# =============================================================================
# CORE ML (CV14) - cần chạy trên macOS hoặc Linux (coremltools không hỗ trợ Windows)
# =============================================================================

coreml_export:
    weights: outputs/train/yolo11n_bdd100k/weights/best.pt
    output_dir: outputs/coreml
    nms: true                      # gộp NMS vào mô hình => Vision trả về VNRecognizedObjectObservation
    profiles:                      # precision: fp32 | fp16 | int8
        - name: yolo11n_320_fp16
          imgsz: 320
          precision: fp16
          target_devices: iPhone 8 (A11, chạy GPU)
        - name: yolo11n_416_fp16
          imgsz: 416
          precision: fp16
          target_devices: iPhone 8 (A11, chạy GPU)
        - name: yolo11n_416_int8
          imgsz: 416
          precision: int8            # nén trọng số INT8
          target_devices: iPhone 8 - thử nén trọng số INT8
        - name: yolo11n_640_fp16
          imgsz: 640
          precision: fp16
          target_devices: iPhone XR/XS trở lên (A12+, chạy ANE)

twinlitenet_export:
    output_dir: outputs/coreml
    output_name: twinlitenet_640x360_fp16
    precision: fp16               # fp32 | fp16 | int8

coreml_verify:
    pytorch_weights: outputs/train/yolo11n_bdd100k/weights/best.pt
    images_dir: data/samples/images
    max_images: 20
    conf: 0.25
    iou: 0.45
    match_iou_threshold: 0.5
    output_json: outputs/coreml/verify_report.json

