[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dashcam-video"
version = "0.1.0"
description = "AI Dashcam: detect + tracking + FCW (+ LDW) on video, DashcamConfig.json for the iOS and Android apps"
requires-python = ">=3.11"
# GPU NVIDIA: cài torch bản CUDA TRƯỚC theo https://pytorch.org/get-started/locally/
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["dashcam_video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: style, F: lỗi thật (biến/import thừa), I: thứ tự import, B: lỗi hay gặp, UP: cú pháp Python mới
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dashcam_video", "tests"]
